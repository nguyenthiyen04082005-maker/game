<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trò Chơi Bắn Bóng</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #87ceeb;
}

h1 {
    color: white;
    text-shadow: 2px 2px 4px #333;
}

#info {
    color: white;
    font-size: 22px;
    margin-bottom: 10px;
}

#game {
    width: 800px;
    max-width: 95%;
    height: 500px;
    margin: auto;
    position: relative;
    overflow: hidden;
    background: linear-gradient(#74c0fc, #d0f0ff);
    border: 4px solid white;
    border-radius: 15px;
}

/* Bóng */
.ball {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    cursor: pointer;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    from {
        transform: translateY(550px);
    }
    to {
        transform: translateY(-100px);
    }
}

/* Súng */
#gun {
    position: absolute;
    bottom: 10px;
    left: 50%;
    font-size: 70px;
    transform: translateX(-50%);
    user-select: none;
}

button {
    margin: 15px 5px;
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #ff6b6b;
    color: white;
}
</style>
</head>

<body>

<h1>🎯 TRÒ CHƠI BẮN BÓNG 🎈</h1>

<div id="info">
    ⭐ Điểm: <span id="score">0</span>
    | ⏱️ Thời gian: <span id="time">30</span>
</div>

<div id="game">
    <div id="gun">🔫</div>
</div>

<button onclick="startGame()">▶️ Bắt đầu chơi</button>

<script>
let score = 0;
let time = 30;
let gameRunning = false;

const game = document.getElementById("game");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");

function createBall() {
    if (!gameRunning) return;

    const ball = document.createElement("div");
    ball.className = "ball";

    const colors = [
        "#ff4d6d",
        "#ffd60a",
        "#06d6a0",
        "#8338ec",
        "#ff7b00"
    ];

    ball.style.background =
        colors[Math.floor(Math.random() * colors.length)];

    ball.style.left =
        Math.random() * (game.clientWidth - 60) + "px";

    ball.style.animationDuration =
        (Math.random() * 3 + 3) + "s";

    ball.onclick = function() {
        if (!gameRunning) return;

        score++;
        scoreText.textContent = score;

        ball.remove();
    };

    game.appendChild(ball);

    setTimeout(() => {
        ball.remove();
    }, 6000);
}

function startGame() {
    if (gameRunning) return;

    score = 0;
    time = 30;
    gameRunning = true;

    scoreText.textContent = score;
    timeText.textContent = time;

    const oldBalls = document.querySelectorAll(".ball");
    oldBalls.forEach(ball => ball.remove());

    const ballInterval = setInterval(() => {
        if (gameRunning) {
            createBall();
        }
    }, 700);

    const timer = setInterval(() => {
        if (!gameRunning) {
            clearInterval(timer);
            clearInterval(ballInterval);
            return;
        }

        time--;
        timeText.textContent = time;

        if (time <= 0) {
            gameRunning = false;

            clearInterval(timer);
            clearInterval(ballInterval);

            alert("🎉 Hết giờ! Bạn đạt được " + score + " điểm!");
        }
    }, 1000);
}
</script>

</body>
</html>
